# Merge these entries into an existing Synapse service; this is not a full stack.
services:
  synapse:
    build:
      context: .
      dockerfile: Dockerfile-synapse
      args:
        SYNAPSE_VERSION: v1.165.0
    environment:
      PYTHONPATH: /modules
    volumes:
      - ./synapse-modules/bridge_video_thumbnails.py:/modules/bridge_video_thumbnails.py:ro
